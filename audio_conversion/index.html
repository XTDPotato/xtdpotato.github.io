<!doctype html>
<html lang="zh-CN" class="mdui-theme-auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="description" content="Material 3 音频转换工具，支持多文件、文件夹导入、裁剪、预览和批量导出。">
  <meta name="theme-color" content="#6750a4">
  <link rel="icon" type="image/svg+xml" href="../icons/audio_conversion.svg">
  <title>音频转换</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/mdui@2.0.3/mdui.css">
  <script src="https://unpkg.com/mdui@2.0.3/mdui.global.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="audio-conversion.css">
</head>
<body>
  <div class="page">
    <mdui-top-app-bar class="topbar">
      <span class="appbar-leading-icon" aria-label="音频转换"><mdui-icon name="audiotrack"></mdui-icon></span>
      <mdui-top-app-bar-title>音频转换</mdui-top-app-bar-title>
      <div class="topbar-spacer"></div>
      <mdui-button-icon id="addFilesBtn" icon="library_add" aria-label="添加音频文件" title="添加音频文件"></mdui-button-icon>
      <mdui-button-icon id="addFolderBtn" icon="create_new_folder" aria-label="添加文件夹" title="添加文件夹"></mdui-button-icon>
      <mdui-button-icon id="convertAllBtn" icon="file_download" aria-label="转换全部" title="转换全部"></mdui-button-icon>
      <mdui-button-icon id="resetBtn" icon="restart_alt" aria-label="清空列表" title="清空列表"></mdui-button-icon>
      <mdui-button-icon id="closeBtn" icon="close" aria-label="关闭音频转换" title="关闭"></mdui-button-icon>
    </mdui-top-app-bar>
    <main class="content">
      <section class="dropzone" id="dropzone" tabindex="0">
        <div class="dropzone-inner">
          <mdui-icon name="audio_file" class="dropzone-icon"></mdui-icon>
          <h2>导入音频</h2>
          <div class="status">支持 MP3、M4A、AAC、WAV、OGG、OPUS、FLAC、WMA、AMR、AIFF 等格式，可同时添加多个文件或直接拖入文件夹</div>
          <div class="dropzone-actions">
            <mdui-button id="pickBtn" variant="filled" icon="upload_file">选择文件</mdui-button>
            <mdui-button id="pickFolderBtn" variant="tonal" icon="folder_open">选择文件夹</mdui-button>
          </div>
          <input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.wave,.ogg,.oga,.opus,.flac,.wma,.amr,.aiff,.aif,.ac3,.mka,.webm,.mp4,.caf,.ape" multiple hidden>
          <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
        </div>
      </section>
      <section class="queue-panel" id="queuePanel" hidden>
        <div class="queue-header">
          <div><div class="queue-title">音频队列</div><div id="queueSummary" class="status">0 个文件</div></div>
          <mdui-button id="convertAllSecondaryBtn" variant="filled" icon="file_download">转换全部</mdui-button>
        </div>
        <div id="queue" class="queue"></div>
        <div id="globalStatus" class="status queue-status" role="status"></div>
      </section>
    </main>
  </div>
  <script type="module" src="audio-conversion.js"></script>
</body>
</html>
