	<link rel="stylesheet" href="styles/rsdb-main.css?v=20260827-23">

	<link rel="stylesheet" href="rsdb.css?v=20260824-10">
	<style>
		/* 启动器在业务脚本加载前也要跟随已保存的明暗主题。 */
		html.rsdb-boot-dark,
		html.rsdb-boot-dark body {
			background: #121212;
		}
		html.rsdb-boot-dark .rsdb-boot-status {
			background: #121212;
			color: #ffffff;
		}
		html.rsdb-boot-dark .rsdb-boot-status::before {
			border-color: rgba(255, 255, 255, 0.24);
			border-top-color: #80cbc4;
		}
	</style>
	<script>
		(() => {
			try {
				const mode = localStorage.getItem('theme') || 'auto';
				const isDark = mode === 'dark'
					|| (mode === 'auto' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
				if (isDark) document.documentElement.classList.add('rsdb-boot-dark');
			} catch (error) {}
		})();
	</script>
	<script src="js/bootstrap.js?v=20260827-39" defer></script>
</head>
<body>
	<main id="rsdbApp" aria-busy="true">
		<div class="rsdb-boot-status" role="status">正在加载表格...</div>
	</main>
</body>
