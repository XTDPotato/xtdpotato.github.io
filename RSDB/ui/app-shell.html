    <div id="themeFlash"></div>
	<mdui-navigation-drawer id="drawer" close-on-overlay-click placement="left" close-on-esc>
		<mdui-top-app-bar slot="header">
			<mdui-top-app-bar-title>功能菜单</mdui-top-app-bar-title>
		</mdui-top-app-bar>
		<mdui-list id="drawerList">
			<mdui-collapse>
				<mdui-collapse-item id="themeCollapse">
					<mdui-list-item slot="header" icon="dark_mode" headline="主题模式 (当前: 自动)"></mdui-list-item>
					<mdui-list id="themeCollapseContent">
						<mdui-list-item class="theme-option" data-theme="auto" icon="brightness_auto" headline="自动 (跟随系统)"></mdui-list-item>
						<mdui-list-item class="theme-option" data-theme="light" icon="light_mode" headline="日间模式"></mdui-list-item>
						<mdui-list-item class="theme-option" data-theme="dark" icon="dark_mode" headline="夜间模式"></mdui-list-item>
					</mdui-list>
				</mdui-collapse-item>
			</mdui-collapse>
			<mdui-divider></mdui-divider>
			<mdui-list-item id="importItem" icon="file_upload" rounded headline="导入 Excel"></mdui-list-item>
			<mdui-list-item id="exportItem" icon="file_download" rounded headline="导出"></mdui-list-item>
			<mdui-list-item id="manualSaveItem" icon="save" rounded headline="手动保存"></mdui-list-item>
			<mdui-list-item id="saveAsItem" icon="save_as" rounded headline="另存为"></mdui-list-item>
			<mdui-list-item id="openDocumentItem" icon="folder_open" rounded headline="打开"></mdui-list-item>
			<mdui-list-item id="calculatorBtn" icon="calculate" rounded headline="计算重量"></mdui-list-item>
		
			<mdui-list-item id="sortItem" icon="sort" rounded headline="数据排序"></mdui-list-item>
			
			<mdui-list-item id="settingsBtn" rounded icon="settings" headline="设置"></mdui-list-item>
			<mdui-list-item id="installPwaBtn" rounded icon="download" headline="安装应用" style="display: none;"></mdui-list-item>
		</mdui-list>
	</mdui-navigation-drawer>
	<div class="top-fixed-area">
		<div class="action-bar">
			<mdui-button-icon icon="menu" id="openDrawerBtn"></mdui-button-icon>
			<mdui-tooltip content="搜索"><mdui-button-icon icon="search" id="topSearchBtn"></mdui-button-icon></mdui-tooltip>
			<mdui-tooltip content="多选格子"><mdui-button-icon icon="grid_view" id="topCellMultiSelectBtn"></mdui-button-icon></mdui-tooltip>
			<div class="excel-action-buttons" aria-label="常用操作">
				<mdui-tooltip content="撤销"><mdui-button-icon icon="undo" id="topUndoBtn"></mdui-button-icon></mdui-tooltip>
				<mdui-tooltip content="重做"><mdui-button-icon icon="redo" id="topRedoBtn"></mdui-button-icon></mdui-tooltip>
				<mdui-tooltip content="手动保存"><mdui-button-icon icon="save" id="topSaveBtn"></mdui-button-icon></mdui-tooltip>
				<span class="appbar-action-divider" aria-hidden="true"></span>
				<mdui-tooltip content="缩小表格"><mdui-button-icon icon="zoom_out" id="topTableZoomOutBtn"></mdui-button-icon></mdui-tooltip>
				<mdui-tooltip content="放大表格"><mdui-button-icon icon="zoom_in" id="topTableZoomInBtn"></mdui-button-icon></mdui-tooltip>
				<mdui-tooltip content="恢复默认缩放"><mdui-button-icon icon="restart_alt" id="topTableZoomResetBtn"></mdui-button-icon></mdui-tooltip>
			</div>
			<div class="top-action-buttons">
				<mdui-dropdown placement="bottom-end">
			<mdui-button-icon slot="trigger" icon="more_vert" id="topMenuBtn"></mdui-button-icon>
			<mdui-menu>
						<mdui-menu-item id="searchMenuItem" icon="search" style="display:none;">搜索</mdui-menu-item>
						<mdui-menu-item id="multiSelectMenuItem" icon="check_box_outline_blank">进入多选模式</mdui-menu-item>
					<mdui-menu-item id="cellMultiSelectMenuItem" icon="grid_view" style="display:none;">多选格子</mdui-menu-item>
					<mdui-menu-item id="cellSelectionSetMenuItem" icon="tune" style="display:none;">统一设置选中格子</mdui-menu-item>
					<mdui-menu-item id="cellSelectionDeleteDataMenuItem" icon="delete" style="display:none;">删除选中格子数据</mdui-menu-item>
					<mdui-menu-item id="cellSelectionDeleteStyleMenuItem" icon="format_clear" style="display:none;">删除选中格子属性</mdui-menu-item>
					<mdui-menu-item id="invertSelectionMenuItem" icon="flip_to_back" style="display:none;">反选</mdui-menu-item>
                    <mdui-menu-item id="operationHistoryMenuItem" icon="list_alt">操作详细列表</mdui-menu-item>
                    <mdui-menu-item id="deleteAllDataMenuItem" icon="delete_forever">删除所有表格数据</mdui-menu-item>
					</mdui-menu>
				</mdui-dropdown>
			</div>
		</div>
		<div class="search-replace-container" id="searchReplaceContainer" style="display: none;">
			<div class="search-replace-main">
				<div class="search-query-row">
					<div class="search-bar">
						<mdui-text-field id="searchInput" label="搜索所有字段" placeholder="输入关键词" variant="outlined" clearable></mdui-text-field>
					</div>
					<mdui-button-icon icon="close" id="closeSearchPanelBtn" aria-label="关闭搜索"></mdui-button-icon>
				</div>
				<div class="search-replace-top-row">
					<mdui-text-field id="replaceQuery" label="替换为" placeholder="输入替换内容" variant="outlined"></mdui-text-field>
					<div class="search-replace-nav-buttons">
					<mdui-tooltip content="上一个">
						<mdui-button-icon icon="arrow_upward" id="prevMatchBtn"></mdui-button-icon>
						</mdui-tooltip>
						<mdui-tooltip content="下一个">
						<mdui-button-icon icon="arrow_downward" id="nextMatchBtn"></mdui-button-icon>
						</mdui-tooltip>
					</div>
				</div>
				<div class="search-replace-button-row">
					<mdui-button variant="filled" id="replaceOneBtn" disabled>替换当前</mdui-button>
					<mdui-button variant="outlined" id="replaceAllBtn" color="error" disabled>替换全部</mdui-button>
				</div>
				<div class="search-replace-bottom-row">
					<span id="searchResultCount">找到 0 个匹配项</span>
					<mdui-checkbox id="filterMatchRowsCheckbox">只显示匹配行</mdui-checkbox>
				</div>
			</div>
		</div>
		<div class="batch-action-container">
			<mdui-button variant="outlined" color="error" id="deleteSelectedBtn" style="display: none; width: 100%;">
				<mdui-icon name="delete"></mdui-icon> 批量删除 (<span id="selectedCount">0</span>) </mdui-button>
		</div>
	</div>
	<div class="data-table-container-div">
		<div class="data-table-container">
			<table id="dataTable">
				<thead>
					<tr>
						<th class="seq-col" data-field="seq">序号</th>
						<th class="checkbox-col" style="display: none;">
							<mdui-checkbox id="selectAllCheckbox">全选</mdui-checkbox>
						</th>
						<th data-field="steelType">钢种</th>
						<th data-field="productId">产品号</th>
						<th data-field="cardId">卡片号</th>
						<th data-field="furnaceId">炉号</th>
						<th data-field="actualDiameter">实际直径</th>
						<th data-field="diameter">直径</th>
						<th data-field="length">长度</th>
						<th data-field="weight">重量</th>
						<th data-field="status">状态</th>
						<th data-field="position">位置</th>
						<th data-field="hardness">硬度</th>
						<th class="remark-col" data-field="remarks">备注</th>
						<th class="image-col">卡片图片</th>
						<th class="action-col">操作</th>
					</tr>
				</thead>
				<tbody id="tableBody"></tbody>
			</table>
		</div>
		<div class="bottom-data-summary">
			<div class="bottom-summary-content">
				<div class="bottom-summary-left" id="totalCountText">共 0 条数据</div>
				<div class="bottom-summary-right">
					<div class="page-info-container">
						<span class="page-info-text" id="pageInfoText">第 1 / 1 页</span>
						<input type="number" class="page-input" id="pageJumpInput" min="1" value="1">
					</div>
					<div style="display: flex; gap: 8px;">
						<mdui-button-icon icon="navigate_before" id="bottomPrevBtn"></mdui-button-icon>
						<mdui-button-icon icon="navigate_next" id="bottomNextBtn"></mdui-button-icon>
					</div>
				</div>
			</div>
		</div>
		<div class="empty-state" id="emptyState">
			<span class="material-icons" style="font-size: 48px;">inbox</span>
			<p>暂无数据，点击右下角“添加”按钮开始录入。</p>
		</div>
	</div>
	<input type="file" id="fileInput" accept=".xlsx,.xls,.zip,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip" style="display:none;">
